<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function() {
        // Intercept unhandled promise rejections from Vite client WebSocket in iframe
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            String(event.reason.message || event.reason).includes('WebSocket closed without opened') ||
            String(event.reason.message || event.reason).includes('WebSocket')
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (event && (
            event.message?.includes('WebSocket closed without opened') ||
            event.message?.includes('WebSocket')
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>FabTune - Material 3 Music Player</title>
